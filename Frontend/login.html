
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Assistant - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow p-4">
                    <h2 class="text-center mb-4">College Assistant</h2>
                    <h4 class="text-center mb-3">Student Login</h4>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Login
                        </button>
                    </form>

                    <p id="message" class="text-center mt-3"></p>

                    <p class="text-center mt-2">
                        Don't have an account?
                        <a href="/register">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

<script>
    document.getElementById("loginForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const message = document.getElementById("message");

        message.textContent = "Logging in...";
        message.className = "text-center mt-3 text-primary";

        try {
            const response = await fetch("/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            });

            const data = await response.json();

            if (response.ok) {
                sessionStorage.setItem("access_token", data.access_token);
                sessionStorage.setItem("user_name", data.full_name);
                sessionStorage.setItem("user_role", data.role);
                sessionStorage.setItem("user_id", data.user_id);

                message.textContent = "Login successful! Welcome " + data.full_name;
                message.className = "text-center mt-3 text-success";
                setTimeout(() => {
                        window.location.href = "/dashboard";
                }, 1500);
            } else {
                message.textContent = data.detail || "Login failed.";
                message.className = "text-center mt-3 text-danger";
            }

        } catch (error) {
            message.textContent = "Cannot connect to the server.";
            message.className = "text-center mt-3 text-danger";
        }
    });
</script>

</body>
</html>
