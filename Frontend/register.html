
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Assistant - Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow p-4">
                    <h2 class="text-center mb-4">College Assistant</h2>
                    <h4 class="text-center mb-3">Student Registration</h4>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="full_name" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" minlength="8" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            Register
                        </button>
                    </form>

                    <p id="message" class="text-center mt-3"></p>

                    <p class="text-center mt-2">
                        Already have an account?
                        <a href="/login">Login here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

<script>
    document.getElementById("registerForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const full_name = document.getElementById("full_name").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const message = document.getElementById("message");

        message.textContent = "Creating your account...";
        message.className = "text-center mt-3 text-primary";

        try {
            const response = await fetch("/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    full_name: full_name,
                    email: email,
                    password: password
                })
            });

            const data = await response.json();

            if (response.ok) {
                message.textContent = "Registration successful! Redirecting to login...";
                message.className = "text-center mt-3 text-success";

                setTimeout(() => {
                    window.location.href = "/login";
                }, 1500);

            } else {
                message.textContent = data.detail || "Registration failed.";
                message.className = "text-center mt-3 text-danger";
            }

        } catch (error) {
            message.textContent = "Cannot connect to the server.";
            message.className = "text-center mt-3 text-danger";
        }
    });
</script>

</body>
</html>
