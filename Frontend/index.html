
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI College Assistant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f2f5fa;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #183b70;
        }

        .chat-container {
            max-width: 850px;
            margin: 50px auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .chat-header {
            background: #2456a6;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .chat-body {
            height: 350px;
            overflow-y: auto;
            padding: 25px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 15px;
            max-width: 80%;
        }

        .bot-message {
            background: #e8eef9;
            color: #183b70;
        }

        .user-message {
            background: #2456a6;
            color: white;
            margin-left: auto;
        }

        .chat-input {
            padding: 20px;
            border-top: 1px solid #ddd;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <span class="navbar-brand fw-bold">
            AI College Assistant
        </span>
        <span class="text-white">Student Portal</span>
    </div>
</nav>

<div class="chat-container">

    <div class="chat-header">
        <h2>Welcome to College Assistant</h2>
        <p class="mb-0">Your smart college information chatbot</p>
    </div>

    <div class="chat-body" id="chatBox">
        <div class="message bot-message">
            Hello! Welcome to your AI College Assistant.
            How can I help you today?
        </div>
    </div>

    <div class="chat-input">
        <div class="input-group">
            <input
                type="text"
                id="userInput"
                class="form-control"
                placeholder="Ask your college-related question..."
            >

            <button class="btn btn-primary" onclick="sendMessage()">
                Send
            </button>
        </div>
    </div>

</div>

<script>
    
async function sendMessage() {

    const input = document.getElementById("userInput");
    const chatBox = document.getElementById("chatBox");

    const message = input.value.trim();

    if (message === "") {
        return;
    }

    // Display user message
    const userMessage = document.createElement("div");
    userMessage.className = "message user-message";
    userMessage.textContent = message;

    chatBox.appendChild(userMessage);

    input.value = "";

    // Display loading message
    const loadingMessage = document.createElement("div");
    loadingMessage.className = "message bot-message";
    loadingMessage.textContent = "Please wait...";
    chatBox.appendChild(loadingMessage);

    chatBox.scrollTop = chatBox.scrollHeight;

    try {

        // Send message to FastAPI backend
        const response = await fetch("/ask", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })
        });

        if (!response.ok) {
            throw new Error("Server error: " + response.status);
        }

        const data = await response.json();

        // Display backend answer
        loadingMessage.textContent = data.answer;

    } catch (error) {

        loadingMessage.textContent =
            "Sorry! Unable to connect to the server.";

        console.error("Chat error:", error);
    }

    chatBox.scrollTop = chatBox.scrollHeight;
}


// Send message when Enter key is pressed
document.getElementById("userInput").addEventListener(
    "keydown",
    function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
);

</script>

</body>
</html>
