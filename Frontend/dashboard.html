
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - College Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">College Assistant</span>
            <button class="btn btn-light" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2>Welcome, <span id="studentName">Student</span>!</h2>
            <p class="text-muted">Welcome to your Student Dashboard.</p>

            <hr>

            <h5>Student Information</h5>
            <p>Role: <span id="studentRole">Student</span></p>

            <a href="/chat" class="btn btn-primary">
                Open College AI Assistant
            </a>
        </div>
    </div>

   
<script>
    const token = sessionStorage.getItem("access_token");

    if (!token) {
        window.location.href = "/login";
    } else {
        loadDashboard();
    }

    async function loadDashboard() {
        try {
            const response = await fetch("/api/dashboard", {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            if (response.status === 401) {
                sessionStorage.clear();
                window.location.href = "/login";
                return;
            }

            if (!response.ok) {
                throw new Error("Unable to load dashboard");
            }

            const data = await response.json();

            document.getElementById("studentName").textContent =
                data.full_name;

            document.getElementById("studentRole").textContent =
                data.role;

        } catch (error) {
            console.error(error);
            alert("Unable to load student information.");
        }
    }

    function logout() {
        sessionStorage.clear();
        window.location.href = "/login";
    }
</script>


</body>
</html>
